[pytest]
pythonpath = .
testpaths = tests
; jieba/_compat.py 每次 import 都会发这条 deprecation warning（第三方代码，
; 非本项目）。模式刻意收窄到这一句，避免顺手屏蔽掉我们自己代码发出的警告。
; error 把所有「未被上面忽略的」警告升级为失败：输出干净必须是被强制的，
; 而不是靠大家自觉。
;
; 顺序不能反：pytest 按行的先后逐条调 warnings.filterwarnings()，而后者是
; **头插**，故越靠后的条目优先级越高。error 必须在前，收窄的 ignore 必须在后，
; 否则 error 会把那条忽略也一起盖掉，jieba 的警告直接让收集阶段报错。
filterwarnings =
    error
    ignore:pkg_resources is deprecated as an API:UserWarning

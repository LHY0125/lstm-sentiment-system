# 基于 LSTM 的网络评论情感分类系统 —— 生产编排（1Panel 用）
#
# 单容器：Flask 同时提供 API 与前端 SPA（dist 由镜像的多阶段构建产出）。
#
# 与仓库里的 docker-compose.yml 有三处不同，前两处是因为 1Panel 会把编排文件
# 存到它自己的目录树（/opt/1panel/docker/compose/<名字>/）：
#   · 挂载写成**绝对路径**（相对路径会跟着编排文件跑到 1Panel 目录下）
#   · 去掉 build:（服务器上没有构建上下文，镜像已经 load 好了）
# 第三处是刻意的取舍：
#   · 端口只绑回环 —— 该服务**没有任何鉴权**（见下方 ports 段）
#
# 怎么起：
#   docker compose up -d
# 或者交给 1Panel「容器 → 编排 → 创建编排」。
#
# ⚠️ 上服务器之前，宿主上要先备好两样东西（镜像里都没有）：
#   1) 镜像本体：
#        docker save senti-lstm:1.0.0 -o senti-lstm-1.0.0.tar     # 本地
#        scp senti-lstm-1.0.0.tar tencent:/tmp/ && ssh tencent "docker load -i /tmp/senti-lstm-1.0.0.tar"
#   2) 训练产物 → /opt/senti-lstm/artifacts/
#        sudo install -d -o 10001 -g 10001 /opt/senti-lstm/artifacts
#        # 再把 6 个 .pt + vocab.json + meta.json 拷进去
#
# ⚠️ 公网入口走「阿里云 ESA → 阿里云 openresty 反代 → 阿里云 frps :18300
#    → frpc 隧道 → 本机 127.0.0.1:8300」。反代目标是**本机回环**，
#    故这里绑回环不是限制；frpc 那条代理的 localPort 也是 8300。

services:
  senti-lstm:
    image: senti-lstm:1.0.0
    container_name: senti-lstm

    # 与目标机上其它容器保持一致
    restart: unless-stopped

    ports:
      # 宿主 8300 → 容器 5000（容器内固定 5000，是镜像里 HOST/PORT 的默认值）。
      # **只绑回环**：流量只能经 frpc → 阿里云反代进来，少开一个公网入口。
      # ⚠️ 这里与同机 english-learning-agent 那份**不同**（它绑 0.0.0.0）：
      #    那个服务有会话鉴权，这个**一丁点鉴权都没有** —— 任何能访问该端口的人
      #    都能提交文本让服务器真跑推理（explain 一次 = 101 次前向，CPU 密集），
      #    而同机还跑着 Halo / Gitea / PostgreSQL / meilisearch，算力被吃满会波及它们
      #   （mem_limit 只兜内存，不兜 CPU）。无鉴权的服务不该默认开在公网上。
      - "127.0.0.1:8300:5000"

    volumes:
      # 训练产物。**只读**：推理期一个字都不写。
      # ⚠️ 容器以 uid 10001 运行（Dockerfile 的 USER），宿主目录必须对它可读，
      #    否则表现为 /api/models 返回 [] —— 容器能起、健康检查也过，只是没模型。
      #    只读挂载下 r-x 就够，不需要写权限。
      - /opt/senti-lstm/artifacts:/app/backend/artifacts:ro

    environment:
      - TZ=Asia/Shanghai
      # HOST / PORT 不在这里写：镜像里已默认 HOST=0.0.0.0、PORT=5000。
      # 两处各写一份就是两个真相，日后必然漂移。

    security_opt:
      - no-new-privileges:true

    # **只在无 swap 的这台上报错**：explain 一次 = 101 次串行前向（1 次基线 + 100 次遮挡），
    # CPU 密集且单线程。4 核里钉死 1 个核，最坏情况不至于把同机的 Halo / PostgreSQL
    # 拖到卡顿。mem_limit 只管内存，CPU 需要这一行——这是本文件与本机编排的第三处不同。
    cpus: "1.0"

    # 实测（同镜像）：空跑 180.8 MiB；六个模型全部加载并跑完一次 explain 后
    # 373.6 MiB。**这里写 1g 而非本机编排的 768m**：腾讯云可用内存约 1.2 GiB，
    # 但**没有 swap**，OOM 不可挽回，故给足约 2.7× 余量。上限同时是「不挤邻居」的
    # 承诺——同机还有 Halo / Gitea / PostgreSQL / meilisearch 在抢内存。
    mem_limit: 1g

    # 显式声明健康检查（而非只靠镜像里的 HEALTHCHECK）——与本机另两份
    # 1Panel 编排保持一致。判据只查进程活着、接口答得上话，**刻意不查模型**：
    # 「没挂模型」与「镜像坏了」是两种状态，必须分得开。
    healthcheck:
      # slim 镜像里没有 curl/wget，用 python 自己发请求
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要加载 jieba 词典，给足预热时间
      start_period: 20s

    logging:
      # Flask 每个请求打一行日志，演示时 explain 调用密集。宿主盘已用 64%
      # （剩 14 GB），不封顶会一直长。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
